# Automatic release. When the "version" in manifest.json changes on main, this builds the
# plugin, creates a GitHub release tagged with that version (e.g. 1.2.4), signs build
# provenance (artifact attestations) and attaches main.js, styles.css and manifest.json.
# Usage: bump "version" in manifest.json + versions.json and push to main. Nothing else.
# Skips if a release with that tag already exists.
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]

permissions:
  contents: write       # create the release and tag
  id-token: write       # sign the attestation
  attestations: write   # store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Check whether the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.exists.outputs.skip == 'false'
        run: python3 build.py

      - name: Attest build provenance
        if: steps.exists.outputs.skip == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/styles.css
            dist/manifest.json

      - name: Create release with assets
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.ver.outputs.version }}" dist/main.js dist/styles.css dist/manifest.json --target "$GITHUB_SHA" --title "${{ steps.ver.outputs.version }}" --generate-notes
